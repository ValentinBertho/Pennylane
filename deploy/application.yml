spring:
  application:
    name: Pennylane
  profiles:
    active: ${ENVIRONMENT:DEV}

  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PENNYLANE_DB;encrypt=false}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:changeme}

  jpa:
    show-sql: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 500

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  task:
    scheduling:
      pool:
        size: 5
      thread-name-prefix: "pennylane-scheduler-"

# Configuration Actuator pour exposer les métriques Resilience4j
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,ratelimiters,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

# Configuration Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      pennylaneAPI:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException

      databaseOperations:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 20s
        failureRateThreshold: 60
        recordExceptions:
          - java.sql.SQLException
          - org.springframework.dao.DataAccessException

  retry:
    instances:
      pennylaneAPI:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException.BadRequest
          - org.springframework.web.client.HttpClientErrorException.Unauthorized
          - org.springframework.web.client.HttpClientErrorException.NotFound

      databaseOperations:
        maxAttempts: 2
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.dao.TransientDataAccessException

  ratelimiter:
    instances:
      pennylaneAPI:
        registerHealthIndicator: true
        limitForPeriod: 100
        limitRefreshPeriod: 60s
        timeoutDuration: 5s
        eventConsumerBufferSize: 100

  bulkhead:
    instances:
      schedulerThreadPool:
        maxConcurrentCalls: 5
        maxWaitDuration: 10ms

      pennylaneAPI:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms

  timelimiter:
    instances:
      pennylaneAPI:
        timeoutDuration: 30s
        cancelRunningFuture: true

      databaseOperations:
        timeoutDuration: 60s
        cancelRunningFuture: true

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  level:
    root: INFO
    fr.mismo: INFO
    org.springframework: INFO

# Configuration des tâches planifiées (format cron)
# Modifier selon les besoins : "secondes minutes heures jour mois jour-semaine"
# Utiliser "-" pour désactiver une tâche
cron:
  Entries: "-"
  Purchases: "-"
  UpdateSale: "-"
  UpdatePurchaseReglement: "-"
  PurgeLog: "0 0 2 * * *"  # Tous les jours à 2h du matin

server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Configuration API Pennylane
api:
  url_v1: https://app.pennylane.com/api/external/v2/
  url_v2: https://app.pennylane.com/api/external/v2/

# Configuration des logs applicatifs
Log:
  niveau:
    ERROR: 'Erreur '
    WARN: 'Avertissement '
    INFO: 'Information '
    DEBUG: 'Debug '
    TRACE: 'Détail '
  Actif: true
  Initiateur: 'INTERFACE_PENNYLANE'

# Configuration du service de gestion documentaire
wsdocument:
  defaultUri: ${WSDOC_URI:http://localhost:8080/WSDocumentAth/WSDocumentAth.svc}
  proprieteDocument:
    typeDocument: PENNYLANE
    auteurDocument: ${WSDOC_AUTHOR:ADMIN}
  login: ${WSDOC_LOGIN:admin}
  password: ${WSDOC_PASSWORD:changeme}
  timeouts:
    readTimeout: 60000
    connectionTimeout: 60000

# Configuration du traitement des factures
facture:
  statusAFiltrer: 'to_be_processed'
  daysBackward: 360
  categoriesAFiltrer:
    - ACH
  lastInsertPurchases: ${LAST_INSERT_DATE:2024-01-01T00:00:00}